name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - name: Check committed experiment results against the engine
        run: |
          python -m examples.lost_ack > "$RUNNER_TEMP/lost_ack.json"
          diff -u examples/lost_ack.json "$RUNNER_TEMP/lost_ack.json"
          python -m relaybench matrix --seeds 12 > "$RUNNER_TEMP/baseline-results.json"
          diff -u docs/baseline-results.json "$RUNNER_TEMP/baseline-results.json"
      - run: node --check relaybench/static/app.js
